# Temporary ungated publish for nss + opencryptoki (temp branch only).
#
# Mirrors provider-delivery seal -> build -> smoke exactly, then pushes the
# CI-built runtime image to ghcr.io/p11lab/<env>:<version>+latest. This is the
# same temporary path the first five provider images took: the admit gate
# stays fail-closed (source/license evidence flow unwired) and no commit on
# this branch weakens it. Delete this file before merging to main.
name: tmp-publish-nss-ock

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Provider environment (nss or opencryptoki)"
        required: true
        type: choice
        options: [nss, opencryptoki]

permissions:
  contents: read
  packages: write

jobs:
  seal-build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P11Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve the effective registry
        shell: bash
        run: |
          set -eu
          # inputs.environment is a choice of two safe literals; no interpolation risk.
          echo "P11LAB_REGISTRY=ghcr.io/p11lab/${{ inputs.environment }}" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install P11Lab
        shell: bash
        run: |
          set -eu
          python -m pip install .
          p11lab --help >/dev/null
      - name: Resolve and seal release sources
        shell: bash
        run: |
          set -eu
          p11lab resolve "${{ inputs.environment }}" --channel release --output-dir resolve-out
          p11lab publish seal-sources "${{ inputs.environment }}" --channel release \
            --resolved-dir resolve-out --output-dir seal-out
      - name: Build the exact runtime binary
        shell: bash
        run: |
          set -eu
          p11lab build "${{ inputs.environment }}" --channel release --output-dir build-out
          python -c 'import json; print(json.load(open("build-out/artifact.json"))["artifact"]["reference"])'
      - name: Test with the installed C consumer and OpenSSL oracle
        shell: bash
        run: |
          set -eu
          PROVIDER_ID=$(python -c 'import json; print(json.load(open("build-out/artifact.json"))["artifact"]["reference"])')
          docker tag "$PROVIDER_ID" p11lab-local-provider:consumer-parent
          test "$(docker image inspect --format '{{.Id}}' p11lab-local-provider:consumer-parent)" = "$PROVIDER_ID"
          python examples/linux/prepare-consumer.py --channel release --output-dir consumer-context
          docker build --platform linux/amd64 --provenance=false \
            --build-arg PROVIDER_IMAGE=p11lab-local-provider:consumer-parent \
            --iidfile consumer-id consumer-context
          CONSUMER_ID=$(cat consumer-id)
          case "${{ inputs.environment }}" in
            nss)
              SMOKE_MODULE=/usr/local/lib/p11lab/libsoftokn3.so
              SMOKE_LABEL=P11Lab
              PIN_VALUE=12345678
              SOPIN_VALUE=12345678
              ;;
            opencryptoki)
              SMOKE_MODULE=/usr/local/lib/p11lab/libopencryptoki.so
              SMOKE_LABEL=P11Lab
              PIN_VALUE=123456
              SOPIN_VALUE=12345678
              ;;
          esac
          printf '%s' "$PIN_VALUE" > pin
          printf '%s' "$SOPIN_VALUE" > so-pin
          chmod 600 pin so-pin
          # OpenCryptoki requires primary GID 1001 in the caller; p11lab run
          # forwards the invoking UID:GID into the container. Re-exec under
          # that GID only when needed, after proving socket access survives.
          P11LAB_BIN="$(command -v p11lab)"
          RUN_SUDO=""
          if [ "${{ inputs.environment }}" = "opencryptoki" ] && [ "$(id -g)" != 1001 ]; then
            sudo -n -g '#1001' true 2>/dev/null && sudo -n -g '#1001' docker info >/dev/null 2>&1 || {
              echo "opencryptoki delivery test needs primary GID 1001" >&2
              exit 1
            }
            RUN_SUDO="sudo -n -g #1001"
          fi
          $RUN_SUDO "$P11LAB_BIN" run "${{ inputs.environment }}" --channel release --artifact "$CONSUMER_ID" \
            --input "P11LAB_PIN_FILE=$PWD/pin" --input "P11LAB_SO_PIN_FILE=$PWD/so-pin" \
            --output-dir smoke-run -- \
            p11lab-smoke --module "$SMOKE_MODULE" \
            --token-label "$SMOKE_LABEL" --pin-file /run/p11lab-input/P11LAB_PIN_FILE \
            --output /p11lab-output/crypto --key-mode generated
          python -c 'from p11lab.catalog import package_data; from pathlib import Path; Path("verify.py").write_bytes(package_data("consumer/verify.py").read_bytes())'
          python verify.py smoke-run/crypto
          openssl version
      - name: Push the smoke-tested image
        shell: bash
        run: |
          set -eu
          PROVIDER_ID=$(python -c 'import json; print(json.load(open("build-out/artifact.json"))["artifact"]["reference"])')
          VERSION_TAG=$(python -c 'from p11lab.publish import runtime_aliases; print(runtime_aliases("${{ inputs.environment }}", "release")[0])')
          echo "$VERSION_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$PROVIDER_ID" "$P11LAB_REGISTRY:$VERSION_TAG"
          docker tag "$PROVIDER_ID" "$P11LAB_REGISTRY:latest"
          docker push "$P11LAB_REGISTRY:$VERSION_TAG" | tee push-version.log
          docker push "$P11LAB_REGISTRY:latest" | tee push-latest.log
          {
            echo "## tmp publish ${{ inputs.environment }}"
            echo ""
            echo "registry: $P11LAB_REGISTRY"
            echo "version tag: $VERSION_TAG"
            grep -E '^.*digest: sha256:' push-version.log | tail -1
            grep -E '^.*digest: sha256:' push-latest.log | tail -1
          } >> "$GITHUB_STEP_SUMMARY"
