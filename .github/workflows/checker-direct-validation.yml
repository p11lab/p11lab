# SPDX-License-Identifier: Apache-2.0
# Direct-lane pkcs11-check runs for pushed provider runtimes (basic + full).
# Pipeline: select (resolve env list: explicit single env, PR-changed
# provider dirs, or full lane roster) -> derivative (local-only checker
# images, never pushed) -> plan (frozen shard plans, computed INSIDE a
# derivative container) -> shard matrix (one checker run per shard via
# `p11lab run --mode direct`: init -> health -> checker -> post-health)
# -> merge (roster validation + baseline verdict inside a derivative
# container, fail closed). Plan and merge run containerized because roster
# validation compares source paths: only the shared /opt/p11lab-checker
# layout agrees across plan, shard, and merge legs.
# Reusable (workflow_call): single environment + optional exact digest +
# advisory flag (findings record but do not fail; infra always fails).
# A digest override replaces the pin in BOTH the pull verification and the
# derivative FROM so the validated bytes are exactly the override bytes.
# Suites: smoke = frozen smoke-v1 selection, unsharded (PR gate, minutes).
# full = complete suite sharded per provider (~10 min/shard rule borrowed
# from pkcs11-check test_pool.py) and ACTIVATES ONLY when a frozen full-v1
# profile lands (run_checker rejects non-frozen selections by design; until
# then full fails closed naming the prerequisite). Tags are aliases: digests
# below are the run identities (verified 2026-10-26; new pushes MOVE tags).
# Images are UNGATED alpha: no admission verdict, no licensing review, no
# qualification claim. Baselines start empty (unqualified providers fail on
# first findings) and grow only from reviewed evidence. PROVENANCE NOTE: the
# online derivative build resolves checker dependencies unlocked, yet the
# install seal carries the frozen SOURCE/WHEEL/LOCK identities (the frozen
# recipe's acquisition path is not implemented yet). This deviation is
# explicit and temporary: revisit when checker toolset acquisition lands.
# Proxy lane is a separate follow-up: it needs daemon derivatives + checker
# consumers + client bundles that do not exist yet.
name: checker-direct-validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'smoke (PR-fast) or full (complete suite, sharded; needs frozen full-v1 profile).'
        required: true
        default: 'smoke'
      channel:
        description: 'Locked channel (release only until rolling digests are verified).'
        required: true
        default: 'release'
      environment:
        description: "Single environment to validate, or 'all' for the full matrix."
        required: false
        default: 'all'
      digest:
        description: "Exact digest (sha256:...) to validate instead of the pin; applies to single-env runs."
        required: false
        default: ''
      advisory:
        description: "When 'true', provider findings record but do not fail; infra failures still fail."
        required: false
        default: 'false'
  workflow_call:
    inputs:
      environment:
        description: 'Single environment to validate.'
        required: true
        type: string
      digest:
        description: 'Exact digest (sha256:...) to validate instead of the pin.'
        required: false
        type: string
        default: ''
      suite:
        description: 'smoke or full.'
        required: false
        type: string
        default: 'smoke'
      advisory:
        description: "When 'true', provider findings record but do not fail; infra failures still fail."
        required: false
        type: string
        default: 'false'
  pull_request:
    paths:
      - '.github/workflows/checker-direct-validation.yml'
      - 'src/p11lab/data/providers/haskoki/**'
      - 'src/p11lab/data/providers/freehsm/**'
      - 'src/p11lab/data/providers/kryoptic/**'
      - 'src/p11lab/data/providers/bouncyhsm/**'
      - 'src/p11lab/data/providers/softhsm2/**'
      - 'src/p11lab/data/tools.json'
      - 'src/p11lab/data/profiles/smoke-v1.json'
      - 'src/p11lab/checker.py'
      - 'src/p11lab/shards.py'
      - 'src/p11lab/run.py'
      - 'src/p11lab/models.py'

permissions:
  contents: read
  actions: read # merge selects shard artifacts by name via gh (avoids GBs of derivative tarballs)

concurrency:
  group: checker-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HASKOKI_DIGEST: 'sha256:dc7086e2b831f47223460d9ac3afd8cd8106deb9c135d4084d963cd0b7f84daa'
  FREEHSM_DIGEST: 'sha256:559127e1c3f73ded28f708518dd90d376951781863e4112a6185e1b646047197'
  KRYOPTIC_DIGEST: 'sha256:f7398f42e70141f2b321cfbd97f71ef5d7cf401c80ff26e2de9056a45bcb96c9'
  BOUNCYHSM_DIGEST: 'sha256:809ab1985931c7356f53e3675d26632870c06aedaf961987e7e92b1c5496c08e'
  SOFTHSM2_DIGEST: 'sha256:69cdeb9a74d13a3382547e184645ee18a7e9e2315246fd40ca814ef97b970d16'
  CHECKER_VERSION: '0.2.2'
  # Expected-failures baselines per environment and suite (canonical node
  # IDs), reviewed entries only. Empty = unqualified. Extract to files
  # once non-empty.
  BASELINES: '{"haskoki":{"smoke":[],"full":[]},"freehsm":{"smoke":[],"full":[]},"kryoptic":{"smoke":[],"full":[]},"bouncyhsm":{"smoke":["/opt/p11lab-checker/lib/python3.13/site-packages/pkcs11_check/testcases/test_digest.py::TestDigestProperties::test_sha256_empty_data"],"full":[]},"softhsm2":{"smoke":["/opt/p11lab-checker/lib/python3.13/site-packages/pkcs11_check/testcases/test_interface.py::TestInterfaceV30::test_v30_get_interface_list"],"full":[]}}'
  # Full-suite shard counts (smoke is always 1). Starting hints from
  # pkcs11-check test_pool.py timing practice; retune from evidence. Each
  # shard must fit the 900 s in-runner checker cap.
  FULL_SHARDS: '{"haskoki":2,"freehsm":4,"kryoptic":5,"bouncyhsm":8,"softhsm2":2}'

jobs:
  select:
    # Resolve the environment list for this run: an explicit single env
    # (dispatch/call), PR-changed provider dirs, or the full lane roster.
    # An explicit env outside this lane FAILS (a typo must never silently
    # validate nothing); callers gate on lane coverage instead. The
    # selection is recorded in the step summary either way.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      envs: ${{ steps.resolve.outputs.envs }}
      first: ${{ steps.resolve.outputs.first }}
    steps:
      - name: Checkout P11Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve selected environments
        id: resolve
        env:
          P11LAB_EVENT: ${{ github.event_name }}
          P11LAB_INPUT_ENVIRONMENT: ${{ inputs.environment }}
          P11LAB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          LANE_ENVS="haskoki freehsm kryoptic bouncyhsm softhsm2"
          if [ "$P11LAB_EVENT" = "pull_request" ]; then
            git fetch -q --depth 1 origin "$P11LAB_BASE_REF"
            changed="$(git diff --name-only "origin/$P11LAB_BASE_REF"...HEAD)"
            envs="$(printf '%s\n' "$changed" | grep -oE '^src/p11lab/data/providers/[a-z0-9-]+/' | cut -d/ -f5 | sort -u | tr '\n' ' ' || true)"
            if printf '%s\n' "$changed" | grep -Eqv '^src/p11lab/data/providers/[a-z0-9-]+/'; then
              envs="$LANE_ENVS"  # shared code or workflow itself: full lane
            fi
            # Intersect with this lane; the lane-scoped paths filter keeps
            # this non-empty (only lane provider dirs trigger by path).
            selected=""
            for env in $envs; do
              case " $LANE_ENVS " in *" $env "*) selected="$selected $env";; esac
            done
            envs="$selected"
            test -n "$envs" || { echo 'no lane env selected; check the paths filter' >&2; exit 1; }
          elif [ -n "$P11LAB_INPUT_ENVIRONMENT" ] && [ "$P11LAB_INPUT_ENVIRONMENT" != "all" ]; then
            case " $LANE_ENVS " in
              *" $P11LAB_INPUT_ENVIRONMENT "*) envs="$P11LAB_INPUT_ENVIRONMENT" ;;
              *) echo "environment $P11LAB_INPUT_ENVIRONMENT is not covered by the direct lane" >&2; exit 1 ;;
            esac
          else
            envs="$LANE_ENVS"
          fi
          envs_json="$(python3 -c 'import json,sys; print(json.dumps(sorted(sys.argv[1:])))' $envs)"
          first="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[0])' "$envs_json")"
          printf 'envs=%s\n' "$envs_json" >> "$GITHUB_OUTPUT"
          printf 'first=%s\n' "$first" >> "$GITHUB_OUTPUT"
          {
            echo "## direct lane selection"
            echo ""
            echo "event: $P11LAB_EVENT"
            echo "envs: $envs_json"
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    needs: [select, derivative]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
      suite: ${{ steps.freeze.outputs.suite }}
      envs: ${{ needs.select.outputs.envs }}
      first: ${{ needs.select.outputs.first }}
    steps:
      - name: Checkout P11Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Install p11lab CLI and validate catalogue
        run: |
          python -m pip install --disable-pip-version-check .
          p11lab validate
          docker version --format '{{.Server.Version}}'

      - name: Download one derivative image (shared layout)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Any single derivative: all lane images share the identical
          # /opt/p11lab-checker layout the roster validation compares.
          name: checker-direct-derivative-${{ needs.select.outputs.first }}-${{ github.run_id }}
          path: incoming-derivative/

      - name: Freeze shard plans (inside derivative container)
        id: freeze
        env:
          P11LAB_INPUT_SUITE: ${{ inputs.suite }}
          P11LAB_INPUT_CHANNEL: ${{ inputs.channel }}
          P11LAB_SELECTED_ENVS: ${{ needs.select.outputs.envs }}
          P11LAB_FIRST_ENV: ${{ needs.select.outputs.first }}
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ]; then suite='smoke'; else suite="$P11LAB_INPUT_SUITE"; fi
          case "$suite" in smoke|full) ;; *) echo "unknown suite $suite" >&2; exit 1 ;; esac
          channel="${P11LAB_INPUT_CHANNEL:-release}"
          test "$channel" = 'release' || { echo "channel $channel is not verified for checker-direct" >&2; exit 1; }
          test -n "$P11LAB_FIRST_ENV" || { echo 'no environment selected' >&2; exit 1; }
          # The planner rosters every FULL_SHARDS key: restrict the counts
          # to the selected envs so unselected legs plan zero shards.
          FULL_SHARDS_SELECTED="$(python3 -c 'import json,os; print(json.dumps({e: json.loads(os.environ["FULL_SHARDS"])[e] for e in json.loads(os.environ["P11LAB_SELECTED_ENVS"])}))')"
          export FULL_SHARDS_SELECTED
          if [ "$suite" = 'full' ] && [ ! -f 'src/p11lab/data/profiles/full-v1.json' ]; then
            echo 'full suite needs a frozen full-v1 profile (run_checker rejects non-frozen selections); smoke-v1 is the only frozen profile' >&2
            exit 1
          fi
          gzip -dc "incoming-derivative/derivative-$P11LAB_FIRST_ENV.tar.gz" | docker load
          mkdir -p planwork/plan
          cat > planwork/planner.py <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          import pkcs11_check.testcases as tests
          from p11lab.checker import load_profile
          from p11lab.shards import plan_shards

          suite = sys.argv[1]
          root = Path(tests.__file__).resolve().parent
          counts = json.loads(os.environ['FULL_SHARDS'])
          if suite == 'smoke':
              rosters = {env: load_profile()['nodes'] for env in counts}
              counts = {env: 1 for env in counts}
              frozen = load_profile()
          else:
              profile_name = '/opt/p11lab-code/p11lab/data/profiles/full-v1.json'
              frozen = json.loads(Path(profile_name).read_text())
              rosters = {env: frozen['nodes'] for env in counts}
          matrix = []
          for env, roster in sorted(rosters.items()):
              plan_dir = Path('/work/plan') / env
              plan = plan_shards(root, roster, counts[env], plan_dir)
              for shard in plan['shards']:
                  # Full frozen identity + shard nodes: load_profile(path)
                  # rejects nodes-only files.
                  profile = dict(frozen, nodes=shard['nodes'])
                  (plan_dir / ('shard-%d.json' % shard['shard_id'])).write_text(json.dumps(profile, indent=2))
                  matrix.append({'environment': env, 'shard': shard['shard_id'],
                                 'nodes': len(shard['nodes'])})
          print('MATRIX=' + json.dumps({'include': matrix}))
          print('suite=%s shards=%d' % (suite, len(matrix)), file=sys.stderr)
          PY
          docker run --rm --network none --entrypoint /opt/p11lab-checker/bin/python \
            -e "FULL_SHARDS=$FULL_SHARDS_SELECTED" -v "$PWD/planwork:/work" "p11lab-ci/checker-$P11LAB_FIRST_ENV:local" \
            /work/planner.py "$suite" > planwork/planner.log 2>&1
          grep '^MATRIX=' planwork/planner.log | head -n 1 | sed 's/^MATRIX=/matrix=/' > planwork/matrix.out
          test -s planwork/matrix.out || { echo 'planner produced no matrix' >&2; tail -n 20 planwork/planner.log >&2; exit 1; }
          cat planwork/matrix.out >> "$GITHUB_OUTPUT"
          printf 'suite=%s\n' "$suite" >> "$GITHUB_OUTPUT"
          mv planwork/plan ./plan

      - name: Upload shard plans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checker-direct-plan-${{ github.run_id }}
          path: plan/
          retention-days: 30
          if-no-files-found: error

  derivative:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.select.outputs.envs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout P11Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pull runtime by digest and verify identity
        env:
          P11LAB_DIGEST_OVERRIDE: ${{ inputs.digest }}
        run: |
          digest_var="$(echo '${{ matrix.environment }}' | tr '[:lower:]' '[:upper:]')_DIGEST"
          digest="${!digest_var}"
          test -n "$digest" || { echo 'no digest pin' >&2; exit 1; }
          if [ -n "$P11LAB_DIGEST_OVERRIDE" ]; then
            case "$P11LAB_DIGEST_OVERRIDE" in
              sha256:[0-9a-f]*)
                test "${#P11LAB_DIGEST_OVERRIDE}" -eq 71 || { echo 'bad digest override' >&2; exit 1; }
                digest="$P11LAB_DIGEST_OVERRIDE"
                echo "validating override digest $digest instead of the pin" ;;
              *) echo 'bad digest override' >&2; exit 1 ;;
            esac
          fi
          ref="ghcr.io/p11lab/${{ matrix.environment }}@$digest"
          docker pull "$ref"
          actual="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref" | cut -d@ -f2)"
          test "$actual" = "$digest" || { echo "digest drift: $actual" >&2; exit 1; }

      - name: Build local checker derivative (never pushed)
        env:
          P11LAB_DIGEST_OVERRIDE: ${{ inputs.digest }}
        run: |
          # Online-build deviation from the offline checker.Dockerfile recipe
          # (checker toolset acquisition is not implemented yet): same
          # /opt/p11lab-checker layout, adapter sources from this checkout.
          # Replace with a pulled derivative once published.
          rev="$(python3 -c 'import json; print(json.load(open("src/p11lab/data/tools.json"))["tools"]["checker"]["source"]["revision"])')"
          url="$(python3 -c 'import json; print(json.load(open("src/p11lab/data/tools.json"))["tools"]["checker"]["source"]["url"])')"
          digest_var="$(echo '${{ matrix.environment }}' | tr '[:lower:]' '[:upper:]')_DIGEST"
          digest="${!digest_var}"
          if [ -n "$P11LAB_DIGEST_OVERRIDE" ]; then
            case "$P11LAB_DIGEST_OVERRIDE" in
              sha256:[0-9a-f]*)
                test "${#P11LAB_DIGEST_OVERRIDE}" -eq 71 || { echo 'bad digest override' >&2; exit 1; }
                digest="$P11LAB_DIGEST_OVERRIDE" ;;
              *) echo 'bad digest override' >&2; exit 1 ;;
            esac
          fi
          cat > "$RUNNER_TEMP/Dockerfile.checker" <<EOF
          FROM ghcr.io/p11lab/${{ matrix.environment }}@$digest
          RUN apt-get update && apt-get install -y --no-install-recommends python3 python3-venv git \
            && rm -rf /var/lib/apt/lists/* \
            && python3 -c "import sys; assert sys.version_info >= (3, 12), sys.version"
          RUN python3 -m venv /opt/p11lab-checker
          RUN /opt/p11lab-checker/bin/pip install --no-cache-dir "pkcs11-check @ git+$url@$rev"
          COPY src/p11lab /opt/p11lab-code/p11lab/
          RUN chmod -R a+rX /opt/p11lab-code \
            && /opt/p11lab-checker/bin/python -c 'import sysconfig; open(sysconfig.get_paths()["purelib"] + "/p11lab.pth", "w").write("/opt/p11lab-code\n")' \
            && /opt/p11lab-checker/bin/python -c "import importlib.metadata as m; assert m.version('pkcs11-check') == '$CHECKER_VERSION', m.version('pkcs11-check')" \
            && mkdir -p /usr/share/p11lab \
            && /opt/p11lab-checker/bin/python -c 'import json; from p11lab.checker import SOURCE,WHEEL,LOCK; open("/usr/share/p11lab/checker-install.json","w").write(json.dumps({"source_revision":SOURCE,"wheel_sha256":WHEEL,"runtime_lock_sha256":LOCK}))' \
            && /opt/p11lab-checker/bin/python -c 'from p11lab.checker import installed_identity,source_inventory,load_profile; from pathlib import Path; i=installed_identity(); source_inventory(Path(i["installed_root"]),load_profile()["nodes"])'
          EOF
          docker build --no-cache -f "$RUNNER_TEMP/Dockerfile.checker" \
            -t "p11lab-ci/checker-${{ matrix.environment }}:local" .

      - name: Save derivative image
        run: |
          docker save "p11lab-ci/checker-${{ matrix.environment }}:local" \
            | gzip -1 > "derivative-${{ matrix.environment }}.tar.gz"
          ls -la derivative-*.tar.gz

      - name: Upload derivative image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checker-direct-derivative-${{ matrix.environment }}-${{ github.run_id }}
          path: derivative-${{ matrix.environment }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  shard:
    needs: [plan, derivative]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Checkout P11Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Install p11lab CLI
        run: |
          python -m pip install --disable-pip-version-check .
          docker version --format '{{.Server.Version}}'

      - name: Download shard plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checker-direct-plan-${{ github.run_id }}
          path: incoming-plan/

      - name: Download own derivative image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checker-direct-derivative-${{ matrix.environment }}-${{ github.run_id }}
          path: incoming-derivative/

      - name: Load derivative and shard profile
        id: inputs
        run: |
          gzip -dc "incoming-derivative/derivative-${{ matrix.environment }}.tar.gz" | docker load
          printf 'id=%s\n' "$(docker inspect --format '{{.Id}}' 'p11lab-ci/checker-${{ matrix.environment }}:local')" >> "$GITHUB_OUTPUT"
          mkdir -p run-cwd
          cp "incoming-plan/${{ matrix.environment }}/shard-${{ matrix.shard }}.json" \
            run-cwd/shard-profile.json

      - name: Run checker shard (direct lane)
        id: checker
        timeout-minutes: 200
        run: |
          case '${{ matrix.environment }}' in
            haskoki) pin='1234'; so_pin='5678' ;;
            *) pin='1234'; so_pin='12345678' ;;
          esac
          echo "::add-mask::$pin"
          echo "::add-mask::$so_pin"
          # NOTE: shard-out must NOT be pre-created: run_application
          # requires output_dir to be absent (fresh attempt directory).
          mkdir -p run-cwd/secrets
          printf '%s' "$pin" > run-cwd/secrets/pin
          printf '%s' "$so_pin" > run-cwd/secrets/so-pin
          chmod 600 run-cwd/secrets/pin run-cwd/secrets/so-pin
          set +e
          python - '${{ matrix.environment }}' '${{ matrix.shard }}' \
            '${{ steps.inputs.outputs.id }}' <<'PY'
          import json
          import sys
          from pathlib import Path
          from p11lab.catalog import load_environment
          from p11lab.checker import run_checker
          from p11lab.models import ArtifactRef, RunSpec

          env, shard, image_id = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          profile = Path('run-cwd/shard-profile.json').resolve()
          # Gate LABEL on the descriptor allowlist: freehsm fixes its
          # label in-adapter and rejects P11LAB_LABEL as unknown input.
          inputs = {}
          if 'P11LAB_LABEL' in load_environment(env, 'release')['inputs']:
              inputs['P11LAB_LABEL'] = {'haskoki': 'haskoki-demo'}.get(env, 'P11Lab')
          inputs['P11LAB_PIN_FILE'] = str(Path('run-cwd/secrets/pin').resolve())
          inputs['P11LAB_SO_PIN_FILE'] = str(Path('run-cwd/secrets/so-pin').resolve())
          spec = RunSpec(environment=env, channel='release', mode='direct',
                         artifact=ArtifactRef('docker-local', image_id, image_id.removeprefix('sha256:'),
                                              'linux/amd64'),
                         execution_location='provider', consumer_artifact=None, client_artifact=None,
                         argv=(), inputs=inputs, output_dir=Path('shard-out').resolve(),
                         cwd=Path('run-cwd').resolve(), timeout_seconds=3600)
          result = run_checker(spec, str(profile))
          receipt = json.loads((spec.output_dir / 'checker/checker-receipt.json').read_text())
          # Project the 3-key seal: validate_shard_roster compares
          # attempt['checker'] against plan['checker'] exactly.
          seal = {k: receipt['checker'][k] for k in
                  ('source_revision', 'wheel_sha256', 'runtime_lock_sha256')}
          attempt = {'shard_id': shard, 'attempt_id': receipt['attempt_id'],
                     'directory': str(spec.output_dir / 'checker'), 'nodes': receipt['nodes'],
                     'sources': receipt['sources'], 'checker': seal, 'selected': True,
                     'exit_code': result.exit_code, 'app_returncode': result.app_returncode,
                     'lifecycle_errors': list(result.lifecycle_errors),
                     'cleanup_errors': list(result.cleanup_errors),
                     'evidence_complete': receipt['evidence']['complete'] is True}
          Path('attempt.json').write_text(json.dumps(attempt, indent=2))
          print('shard %d exit=%s app=%s lifecycle=%s' % (
              shard, result.exit_code, result.app_returncode, result.lifecycle_errors))
          PY
          status=$?
          set -e
          printf 'run_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          echo "shard driver exit: $status (verdict decided by merge below)"

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checker-direct-shard-${{ matrix.environment }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            shard-out/
            attempt.json
          retention-days: 30
          if-no-files-found: error
          # Roster validation requires the hidden per-target report caches.
          include-hidden-files: true

  merge:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Download plans and shards (by name, skips derivative tarballs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p evidence
          gh run download '${{ github.run_id }}' --name 'checker-direct-plan-${{ github.run_id }}' --dir evidence-plan
          python3 - '${{ needs.plan.outputs.matrix }}' <<'PY'
          import json
          import subprocess
          import sys
          for leg in json.loads(sys.argv[1])['include']:
              name = 'checker-direct-shard-%s-%d-%s' % (
                  leg['environment'], leg['shard'], '${{ github.run_id }}')
              subprocess.run(['gh', 'run', 'download', '${{ github.run_id }}', '--name', name,
                              '--dir', 'evidence/' + name], check=True)
          PY
          mv evidence-plan evidence/checker-direct-plan-${{ github.run_id }}

      - name: Download one derivative image (shared layout)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checker-direct-derivative-${{ needs.plan.outputs.first }}-${{ github.run_id }}
          path: incoming-derivative/

      - name: Validate rosters, merge, verdict (inside derivative container)
        id: verdict
        env:
          P11LAB_ADVISORY: ${{ inputs.advisory }}
          P11LAB_SELECTED_ENVS: ${{ needs.plan.outputs.envs }}
          P11LAB_FIRST_ENV: ${{ needs.plan.outputs.first }}
        run: |
          gzip -dc "incoming-derivative/derivative-$P11LAB_FIRST_ENV.tar.gz" | docker load
          mkdir -p mergework/merged
          cat > mergework/merger.py <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from p11lab.checker import canonical_node
          from p11lab.shards import merge_shards, validate_shard_roster

          suite = sys.argv[1]
          run_id = os.environ['CI_RUN_ID']
          baselines = json.loads(os.environ['BASELINES'])
          selected = set(json.loads(os.environ['SELECTED_ENVS']))
          advisory = os.environ.get('ADVISORY') == 'true'
          problems, failures = [], []

          for env, expected in sorted(baselines.items()):
              if env not in selected:
                  continue
              plan = json.loads((Path('/work/evidence/checker-direct-plan-%s' % run_id) / env / 'plan.json').read_text())
              attempts = []
              for shard_dir in sorted(Path('/work/evidence').glob('checker-direct-shard-%s-*' % env)):
                  record = json.loads((shard_dir / 'attempt.json').read_text())
                  # Re-anchor the worker-local directory to the merged copy.
                  record['directory'] = str(shard_dir / 'shard-out/checker')
                  attempts.append(record)
                  # Runner outcomes are infra evidence, independent of the
                  # provider baseline: lifecycle/cleanup failures fail here.
                  # (app_returncode alone does not: checker test failures
                  # are baseline-gated below, not infra.)
                  for key in ('lifecycle_errors', 'cleanup_errors'):
                      for err in record.get(key) or []:
                          problems.append('%s shard %s %s: %s' % (env, record.get('shard_id'), key, err))
                  # The original checker completeness rejection (drain/
                  # straggler/supervision) is authoritative: merged test
                  # files revalidate independently but never override it.
                  if record.get('evidence_complete') is not True:
                      problems.append('%s shard %s incomplete shard evidence' % (env, record.get('shard_id')))
              roster = validate_shard_roster(plan, attempts)
              if not roster.get('complete'):
                  problems.append('%s: incomplete shard roster: %s' % (env, roster.get('errors')))
                  continue
              merged = merge_shards(plan, attempts, Path('/work/merged') / env)
              if not merged.get('complete'):
                  problems.append('%s: merge incomplete: %s' % (env, merged.get('errors')))
                  continue
              summary = merged.get('summary', {}) or {}
              for key in ('crashed', 'timeout', 'error', 'child_crash', 'child_timeout'):
                  if summary.get(key):
                      problems.append('%s: %d %s outcomes (incomplete evidence)' % (env, summary[key], key))
              if summary.get('incomplete'):
                  problems.append('%s: merged summary marked incomplete' % env)
              root = Path(plan['installed_root'])
              reports = [json.loads(line) for line in
                         (Path('/work/merged') / env / 'merged/report.jsonl').read_text().splitlines() if line.strip()]
              seen = set()
              for report in reports:
                  outcome = str(report.get('outcome', report.get('status', ''))).lower()
                  # Pass-like and outcome-less metadata records carry no
                  # verdict. NOTE: 'skipped' is deliberately NOT pass-like:
                  # skipped tests are missing runtime evidence and must be
                  # explicitly baselined.
                  if not outcome or outcome in {'passed', 'pass', 'ok', 'success'}:
                      continue
                  rtype = report.get('$report_type', '?')
                  if 'nodeid' in report:
                      try:
                          node_id = canonical_node(report['nodeid'], root)
                      except ValueError:
                          problems.append('%s: unrecognized report node %r' % (env, report.get('nodeid')))
                          continue
                  else:
                      # Teardown/synthetic records without a node: baselinable
                      # synthetic id, never silently dropped.
                      node_id = '<%s:%s>' % (env, rtype)
                  if node_id not in expected[suite] and node_id not in seen:
                      seen.add(node_id)
                      failures.append('%s: %s (%s)' % (env, node_id, outcome or 'unknown'))

          verdict = 'pass' if not problems and not failures else 'fail'
          lines = ['## Checker direct (%s suite)' % suite,
                   'infra problems: %d; new failures vs baseline: %d' % (len(problems), len(failures))]
          lines += ['- infra: ' + p for p in problems]
          lines += ['- NEW failure: ' + f for f in failures[:100]]
          if len(failures) > 100:
              lines.append('- ... and %d more' % (len(failures) - 100))
          Path('/work/merged/summary.md').write_text('\n'.join(lines) + '\n')
          Path('/work/merged/verdict.json').write_text(json.dumps(
              {'verdict': verdict, 'problems': len(problems), 'failures': len(failures)}))
          print('\n'.join(lines))
          # Advisory callers (per-delivery validation): findings record but
          # do not fail; infra/incomplete evidence always fails.
          sys.exit(0 if verdict == 'pass' or (advisory and not problems) else 1)
          PY
          set +e
          docker run --rm --network none --entrypoint /opt/p11lab-checker/bin/python \
            -e BASELINES -e CI_RUN_ID='${{ github.run_id }}' \
            -e SELECTED_ENVS="$P11LAB_SELECTED_ENVS" -e ADVISORY="$P11LAB_ADVISORY" \
            -v "$PWD/evidence:/work/evidence:ro" -v "$PWD/mergework:/work" \
            "p11lab-ci/checker-$P11LAB_FIRST_ENV:local" /work/merger.py '${{ needs.plan.outputs.suite }}'
          status=$?
          set -e
          printf 'verdict_status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          mv mergework/merged ./merged

      - name: Publish verdict
        if: always()
        env:
          P11LAB_ADVISORY: ${{ inputs.advisory }}
        run: |
          if [ -f merged/summary.md ]; then cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          test '${{ steps.verdict.outputs.verdict_status }}' = '0' || { echo 'merge verdict: FAIL (see summary)' >&2; exit 1; }
          test -f merged/verdict.json && P11LAB_ADVISORY="$P11LAB_ADVISORY" python3 -c '
          import json, os
          verdict = json.load(open("merged/verdict.json"))
          advisory = os.environ.get("P11LAB_ADVISORY") == "true"
          assert verdict["verdict"] == "pass" or (advisory and verdict.get("problems", 1) == 0), verdict'

      - name: Upload merged evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checker-direct-merged-${{ github.run_id }}
          path: merged/
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
