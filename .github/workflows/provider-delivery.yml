# SPDX-License-Identifier: Apache-2.0
# Source-first producer for one fixed candidate. The independently protected
# source-delivery environment must supply a reviewed immutable controller wheel
# URL and SHA256; an empty/unprotected enrollment is not delivery authority.
# The candidate remains on this runner through D. Binary custody is a later
# stage; runtime exposure and handoff remain blocked.
name: provider-delivery

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Catalogue environment ID.'
        required: true
        default: 'softhsm2'
      channel:
        description: 'Locked channel.'
        required: true
        default: 'release'
      registry:
        description: 'Empty or the fixed ghcr.io/p11lab/softhsm2 repository.'
        required: false

permissions:
  contents: read

concurrency:
  group: provider-${{ inputs.channel }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  producer:
    name: trusted-producer
    environment: source-delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout selected producer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Install independently protected controller wheel
        shell: bash
        env:
          P11LAB_INPUT_ENVIRONMENT: ${{ inputs.environment }}
          P11LAB_INPUT_CHANNEL: ${{ inputs.channel }}
          P11LAB_INPUT_REGISTRY: ${{ inputs.registry }}
          P11LAB_CONTROL_WHEEL_URL: ${{ vars.P11LAB_CONTROL_WHEEL_URL }}
          P11LAB_CONTROL_WHEEL_SHA256: ${{ vars.P11LAB_CONTROL_WHEEL_SHA256 }}
          P11LAB_ENVIRONMENT_READER_TOKEN: ${{ secrets.P11LAB_ENVIRONMENT_READER_TOKEN }}
        run: |
          set -eu
          test "$P11LAB_INPUT_ENVIRONMENT" = softhsm2
          test "$P11LAB_INPUT_CHANNEL" = release
          case "$P11LAB_INPUT_REGISTRY" in ''|ghcr.io/p11lab/softhsm2) ;; *) exit 1;; esac
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" P11LAB_CONTROL_WHEEL_URL="$P11LAB_CONTROL_WHEEL_URL" \
            P11LAB_CONTROL_WHEEL_SHA256="$P11LAB_CONTROL_WHEEL_SHA256" \
            P11LAB_ENVIRONMENT_READER_TOKEN="$P11LAB_ENVIRONMENT_READER_TOKEN" python - <<'PY'
          import json, os, re
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, ProxyHandler, Request, build_opener
          url = urlsplit(os.environ['P11LAB_CONTROL_WHEEL_URL'])
          digest = os.environ['P11LAB_CONTROL_WHEEL_SHA256']
          token = os.environ['P11LAB_ENVIRONMENT_READER_TOKEN']
          if (url.scheme != 'https' or url.hostname != 'github.com' or url.port not in (None, 443)
                  or url.username or url.password or url.query or url.fragment
                  or not re.fullmatch(r'/p11lab/p11lab/releases/download/[A-Za-z0-9._-]+/p11lab-[A-Za-z0-9._-]+\.whl', url.path)
                  or not re.fullmatch(r'[0-9a-f]{64}', digest) or not token or '\n' in token or '\r' in token):
              raise SystemExit('protected controller wheel pin unavailable or invalid')
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = build_opener(ProxyHandler({}), NoRedirect())
          for name, expected in [('P11LAB_CONTROL_WHEEL_URL', os.environ['P11LAB_CONTROL_WHEEL_URL']),
                                 ('P11LAB_CONTROL_WHEEL_SHA256', digest)]:
              api = 'https://api.github.com/repos/p11lab/p11lab/environments/source-delivery/variables/' + name
              request = Request(api, headers={'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json', 'User-Agent': 'p11lab-source-controller'})
              try:
                  with opener.open(request, timeout=15) as response:
                      body = response.read(131073)
                      if response.status != 200 or len(body) > 131072:
                          raise ValueError('invalid response')
                  record = json.loads(body)
                  if record.get('name') != name or record.get('value') != expected:
                      raise ValueError('environment value mismatch')
              except Exception:
                  raise SystemExit('protected environment controller pin unavailable or mismatched') from None
          PY
          unset P11LAB_ENVIRONMENT_READER_TOKEN
          mkdir -m 700 "$RUNNER_TEMP/p11lab-controller" "$RUNNER_TEMP/p11lab-isolated"
          wheel="$RUNNER_TEMP/p11lab-controller/${P11LAB_CONTROL_WHEEL_URL##*/}"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" \
            curl --noproxy '*' --fail --silent --show-error --location --proto '=https' \
              --proto-redir '=https' --max-time 120 --max-filesize 67108864 \
              "$P11LAB_CONTROL_WHEEL_URL" -o "$wheel"
          printf '%s  %s\n' "$P11LAB_CONTROL_WHEEL_SHA256" "$wheel" | sha256sum -c -
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" \
            python -m pip install --no-index --no-deps "$wheel"

      - name: Verify protected producer before candidate work
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: p11lab publish check-producer softhsm2 --channel release

      - name: Resolve, seal and build exact candidate without controller credentials
        shell: bash
        run: |
          set -eu
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" TMPDIR="$RUNNER_TEMP" \
            p11lab resolve softhsm2 --channel release --output-dir resolve-out
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" TMPDIR="$RUNNER_TEMP" \
            p11lab publish seal-sources softhsm2 --channel release --resolved-dir resolve-out --output-dir seal-out
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" TMPDIR="$RUNNER_TEMP" \
            p11lab build softhsm2 --channel release --output-dir build-out

      - name: Prepare fixed validation tools and validate the local candidate
        shell: bash
        run: |
          set -eu
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" TMPDIR="$RUNNER_TEMP" \
            p11lab image prepare-tools --output-dir "$RUNNER_TEMP/p11lab-tools"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" TMPDIR="$RUNNER_TEMP" \
            p11lab image validate-local --artifact build-out/artifact.json \
              --policy "$RUNNER_TEMP/p11lab-tools/validation-policy.json" --output-dir validation-out
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" TMPDIR="$RUNNER_TEMP" \
            p11lab publish materialize-inventory --artifact build-out/artifact.json \
              --build-receipt build-out/artifact.json --output-dir inventory-out

      - name: Reassess complete source and rights before publishing any source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          p11lab publish prepare-source softhsm2 --channel release --artifact build-out/artifact.json \
            --inventory inventory-out/inventory.json --validation-dir validation-out --validation-policy "$RUNNER_TEMP/p11lab-tools/validation-policy.json" \
            --build-receipt build-out/artifact.json --sealed-dir seal-out --output-dir source-preparation

      - name: Install pinned ORAS and patched attestation verifier
        shell: bash
        run: |
          set -eu
          oras_archive="$RUNNER_TEMP/oras.tar.gz"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" \
            curl --noproxy '*' --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-time 120 --max-filesize 4679642 \
              https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz -o "$oras_archive"
          printf '%s  %s\n' f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454 "$oras_archive" | sha256sum -c -
          test "$(wc -c < "$oras_archive")" -eq 4679642
          test "$(tar -tzf "$oras_archive" | LC_ALL=C sort)" = "$(printf 'LICENSE\noras')"
          mkdir "$RUNNER_TEMP/p11lab-oras"
          tar -xzf "$oras_archive" -C "$RUNNER_TEMP/p11lab-oras"
          printf '%s  %s\n' 246c47e91bf2749a555ffe00a9824844c6df3a26d61974e3ce08f2077d79c556 "$RUNNER_TEMP/p11lab-oras/oras" | sha256sum -c -
          archive="$RUNNER_TEMP/gh.tar.gz"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" \
            curl --noproxy '*' --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --max-time 120 --max-filesize 15031001 \
              https://github.com/cli/cli/releases/download/v2.103.2/gh_2.103.2_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' 62ccf747115ddc61237efffdde66a3c8f70ba249433dc64f70801089b59c59c8 "$archive" | sha256sum -c -
          test "$(wc -c < "$archive")" -eq 15031001
          mkdir "$RUNNER_TEMP/p11lab-gh"
          tar -xzf "$archive" -C "$RUNNER_TEMP/p11lab-gh" gh_2.103.2_linux_amd64/bin/gh
          gh="$RUNNER_TEMP/p11lab-gh/gh_2.103.2_linux_amd64/bin/gh"
          printf '%s  %s\n' cbfdc94f3a5c0713c0d6df3e0a1d88a59a76b0c52332aad7d21d112f9da2cc0e "$gh" | sha256sum -c -
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/p11lab-isolated" XDG_CACHE_HOME="$RUNNER_TEMP/p11lab-isolated/cache" \
            "$gh" attestation trusted-root > "$RUNNER_TEMP/p11lab-trusted-root.jsonl"

      - name: Publish only the reviewed source rosters
        shell: bash
        env:
          P11LAB_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P11LAB_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          repo=ghcr.io/p11lab/softhsm2
          oras="$RUNNER_TEMP/p11lab-oras/oras"
          auth="$RUNNER_TEMP/p11lab-registry-auth"
          mkdir -m 700 "$auth"
          trap 'rm -rf "$auth"' EXIT
          printf '%s' "$P11LAB_PUBLISH_TOKEN" | "$oras" login ghcr.io --username "$P11LAB_ACTOR" \
            --password-stdin --registry-config "$auth/config.json"
          tag="source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          (cd seal-out && "$oras" push --registry-config "$auth/config.json" --format json \
            --artifact-type application/vnd.p11lab.sealed-source.v1 "$repo:$tag-seal" \
            sealed-source.tar.gz:application/gzip sealed-source.json:application/json > ../seal-pushed.json)
          (cd source-preparation/evidence && "$oras" push --registry-config "$auth/config.json" --format json \
            --artifact-type application/vnd.p11lab.source-companion.v1 "$repo:$tag-content" \
            source-companion.tar.gz:application/gzip source-companion.json:application/json \
            sbom.spdx.json:application/spdx+json > ../../content-pushed.json)

      - name: Anonymous exact readback and attestation context
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          seal=$(python -c 'import json; print(json.load(open("seal-pushed.json"))["digest"].removeprefix("sha256:"))')
          content=$(python -c 'import json; print(json.load(open("content-pushed.json"))["digest"].removeprefix("sha256:"))')
          p11lab publish source-context softhsm2 --channel release --artifact build-out/artifact.json \
            --evidence-dir source-preparation/evidence --validation-dir validation-out --validation-policy "$RUNNER_TEMP/p11lab-tools/validation-policy.json" \
            --build-receipt build-out/artifact.json --sealed-dir seal-out --registry ghcr.io/p11lab/softhsm2 \
            --source-manifest-digest "$seal" --content-manifest-digest "$content" --output-dir source-context-out

      - name: Attest exact source admission context
        id: source-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: source-context-out/source-context.json
          predicate-type: https://p11lab.org/attestations/source-admission/v1
          predicate: '{"schema_version":1}'

      - name: Authenticate context and recompute D
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P11LAB_ATTESTATION_BUNDLE: ${{ steps.source-attestation.outputs.bundle-path }}
        run: |
          set -eu
          seal=$(python -c 'import json; print(json.load(open("seal-pushed.json"))["digest"].removeprefix("sha256:"))')
          content=$(python -c 'import json; print(json.load(open("content-pushed.json"))["digest"].removeprefix("sha256:"))')
          p11lab publish admit-source softhsm2 --channel release --artifact build-out/artifact.json \
            --evidence-dir source-preparation/evidence --validation-dir validation-out --validation-policy "$RUNNER_TEMP/p11lab-tools/validation-policy.json" \
            --build-receipt build-out/artifact.json --sealed-dir seal-out --registry ghcr.io/p11lab/softhsm2 \
            --source-manifest-digest "$seal" --content-manifest-digest "$content" \
            --attestation-context source-context-out/source-context.json --bundle "$P11LAB_ATTESTATION_BUNDLE" \
            --gh "$RUNNER_TEMP/p11lab-gh/gh_2.103.2_linux_amd64/bin/gh" \
            --trusted-root "$RUNNER_TEMP/p11lab-trusted-root.jsonl" --output-dir source-admission-out

      - name: Assess every fixed custody component and collect its sources
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P11LAB_ATTESTATION_BUNDLE: ${{ steps.source-attestation.outputs.bundle-path }}
        run: |
          set -eu
          seal=$(python -c 'import json; print(json.load(open("seal-pushed.json"))["digest"].removeprefix("sha256:"))')
          content=$(python -c 'import json; print(json.load(open("content-pushed.json"))["digest"].removeprefix("sha256:"))')
          p11lab custody component-sources --environment softhsm2 --channel release --artifact build-out/artifact.json \
            --evidence-dir source-preparation/evidence --validation-dir validation-out --validation-policy "$RUNNER_TEMP/p11lab-tools/validation-policy.json" \
            --build-receipt build-out/artifact.json --sealed-dir seal-out --registry ghcr.io/p11lab/softhsm2 \
            --source-manifest-digest "$seal" --content-manifest-digest "$content" \
            --attestation-context source-context-out/source-context.json --bundle "$P11LAB_ATTESTATION_BUNDLE" \
            --gh "$RUNNER_TEMP/p11lab-gh/gh_2.103.2_linux_amd64/bin/gh" --trusted-root "$RUNNER_TEMP/p11lab-trusted-root.jsonl" \
            --output-dir custody-component-sources > custody-component-summary.json

      - name: Publish only independently reviewed custody component sources
        shell: bash
        env:
          P11LAB_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P11LAB_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          repo=ghcr.io/p11lab/softhsm2
          oras="$RUNNER_TEMP/p11lab-oras/oras"
          auth="$RUNNER_TEMP/p11lab-custody-registry-auth"
          mkdir -m 700 "$auth"
          trap 'rm -rf "$auth"' EXIT
          printf '%s' "$P11LAB_PUBLISH_TOKEN" | "$oras" login ghcr.io --username "$P11LAB_ACTOR" \
            --password-stdin --registry-config "$auth/config.json"
          for component in evaluator-original checker-root consumer-root oracle-root checker-inputs consumer-inputs oracle-inputs checker-image checker-derived consumer-image consumer-derived oracle-image; do
            tag="custody-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${component}"
            (cd "custody-component-sources/$component/evidence" && "$oras" push --registry-config "$auth/config.json" --format json \
              --artifact-type application/vnd.p11lab.source-companion.v1 "$repo:$tag" \
              source-companion.tar.gz:application/gzip source-companion.json:application/json \
              sbom.spdx.json:application/spdx+json > "../../../$component-pushed.json")
          done
          python - <<'PYCODE'
          import json, re
          from pathlib import Path
          names = ('evaluator-original', 'checker-root', 'consumer-root', 'oracle-root',
                   'checker-inputs', 'consumer-inputs', 'oracle-inputs', 'checker-image',
                   'checker-derived', 'consumer-image', 'consumer-derived', 'oracle-image')
          result = {}
          for name in names:
              digest = json.loads(Path(name + '-pushed.json').read_text())['digest']
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit('invalid component source OCI digest')
              result[name] = {'evidence_dir': str(Path('custody-component-sources', name, 'evidence').absolute()),
                              'manifest_sha256': digest.removeprefix('sha256:')}
          Path('custody-component-sources.json').write_text(json.dumps(result, sort_keys=True))
          PYCODE

      - name: Freeze the custody roster after source readback and fresh D
        id: custody_plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P11LAB_ATTESTATION_BUNDLE: ${{ steps.source-attestation.outputs.bundle-path }}
        run: |
          set -eu
          seal=$(python -c 'import json; print(json.load(open("seal-pushed.json"))["digest"].removeprefix("sha256:"))')
          content=$(python -c 'import json; print(json.load(open("content-pushed.json"))["digest"].removeprefix("sha256:"))')
          p11lab custody prepare --environment softhsm2 --channel release --artifact build-out/artifact.json \
            --evidence-dir source-preparation/evidence --validation-dir validation-out --validation-policy "$RUNNER_TEMP/p11lab-tools/validation-policy.json" \
            --build-receipt build-out/artifact.json --sealed-dir seal-out --registry ghcr.io/p11lab/softhsm2 \
            --source-manifest-digest "$seal" --content-manifest-digest "$content" \
            --attestation-context source-context-out/source-context.json --bundle "$P11LAB_ATTESTATION_BUNDLE" \
            --gh "$RUNNER_TEMP/p11lab-gh/gh_2.103.2_linux_amd64/bin/gh" --trusted-root "$RUNNER_TEMP/p11lab-trusted-root.jsonl" \
            --component-sources custody-component-sources.json --output-dir custody-out > custody-prepared.json
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          roles = ('image', 'validation', 'source-records', 'evaluator-original',
                   'checker-tool', 'consumer-tool', 'oracle-tool', 'tool-inputs')
          data = json.loads(Path('custody-prepared.json').read_text())
          parts = [(row['role'], row['part']) for row in data['parts']]
          if len(parts) != len(set(parts)) or any((role, 1) not in parts for role in roles):
              raise SystemExit('invalid custody part roster')
          if any(role not in roles or part not in (1, 2) for role, part in parts):
              raise SystemExit('invalid custody part')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for role in roles:
                  output.write(role.replace('-', '_') + '_part2=' + ('yes' if (role, 2) in parts else 'no') + '\n')
          PYCODE

      - name: Upload fixed custody image part 1
        id: custody_image_part1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-image-part1-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/image-part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody image part 2
        id: custody_image_part2
        if: ${{ success() && steps.custody_plan.outputs.image_part2 == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-image-part2-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/image-part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody validation part 1
        id: custody_validation_part1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-validation-part1-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/validation-part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody validation part 2
        id: custody_validation_part2
        if: ${{ success() && steps.custody_plan.outputs.validation_part2 == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-validation-part2-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/validation-part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody source-records part 1
        id: custody_source_records_part1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-source-records-part1-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/source-records-part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody source-records part 2
        id: custody_source_records_part2
        if: ${{ success() && steps.custody_plan.outputs.source_records_part2 == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-source-records-part2-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/source-records-part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody evaluator-original part 1
        id: custody_evaluator_original_part1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-evaluator-original-part1-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/evaluator-original-part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody evaluator-original part 2
        id: custody_evaluator_original_part2
        if: ${{ success() && steps.custody_plan.outputs.evaluator_original_part2 == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-evaluator-original-part2-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/evaluator-original-part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody checker-tool part 1
        id: custody_checker_tool_part1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-checker-tool-part1-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/checker-tool-part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody checker-tool part 2
        id: custody_checker_tool_part2
        if: ${{ success() && steps.custody_plan.outputs.checker_tool_part2 == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-checker-tool-part2-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/checker-tool-part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody consumer-tool part 1
        id: custody_consumer_tool_part1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-consumer-tool-part1-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/consumer-tool-part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody consumer-tool part 2
        id: custody_consumer_tool_part2
        if: ${{ success() && steps.custody_plan.outputs.consumer_tool_part2 == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-consumer-tool-part2-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/consumer-tool-part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody oracle-tool part 1
        id: custody_oracle_tool_part1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-oracle-tool-part1-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/oracle-tool-part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody oracle-tool part 2
        id: custody_oracle_tool_part2
        if: ${{ success() && steps.custody_plan.outputs.oracle_tool_part2 == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-oracle-tool-part2-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/oracle-tool-part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody tool-inputs part 1
        id: custody_tool_inputs_part1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-tool-inputs-part1-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/tool-inputs-part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fixed custody tool-inputs part 2
        id: custody_tool_inputs_part2
        if: ${{ success() && steps.custody_plan.outputs.tool_inputs_part2 == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-tool-inputs-part2-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-out/parts/tool-inputs-part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Verify uploaded bytes and prepare external finalization
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P11LAB_ATTESTATION_BUNDLE: ${{ steps.source-attestation.outputs.bundle-path }}
          IMAGE_1_ID: ${{ steps.custody_image_part1.outputs.artifact-id }}
          IMAGE_1_DIGEST: ${{ steps.custody_image_part1.outputs.artifact-digest }}
          IMAGE_2_ID: ${{ steps.custody_image_part2.outputs.artifact-id }}
          IMAGE_2_DIGEST: ${{ steps.custody_image_part2.outputs.artifact-digest }}
          VALIDATION_1_ID: ${{ steps.custody_validation_part1.outputs.artifact-id }}
          VALIDATION_1_DIGEST: ${{ steps.custody_validation_part1.outputs.artifact-digest }}
          VALIDATION_2_ID: ${{ steps.custody_validation_part2.outputs.artifact-id }}
          VALIDATION_2_DIGEST: ${{ steps.custody_validation_part2.outputs.artifact-digest }}
          SOURCE_RECORDS_1_ID: ${{ steps.custody_source_records_part1.outputs.artifact-id }}
          SOURCE_RECORDS_1_DIGEST: ${{ steps.custody_source_records_part1.outputs.artifact-digest }}
          SOURCE_RECORDS_2_ID: ${{ steps.custody_source_records_part2.outputs.artifact-id }}
          SOURCE_RECORDS_2_DIGEST: ${{ steps.custody_source_records_part2.outputs.artifact-digest }}
          EVALUATOR_ORIGINAL_1_ID: ${{ steps.custody_evaluator_original_part1.outputs.artifact-id }}
          EVALUATOR_ORIGINAL_1_DIGEST: ${{ steps.custody_evaluator_original_part1.outputs.artifact-digest }}
          EVALUATOR_ORIGINAL_2_ID: ${{ steps.custody_evaluator_original_part2.outputs.artifact-id }}
          EVALUATOR_ORIGINAL_2_DIGEST: ${{ steps.custody_evaluator_original_part2.outputs.artifact-digest }}
          CHECKER_TOOL_1_ID: ${{ steps.custody_checker_tool_part1.outputs.artifact-id }}
          CHECKER_TOOL_1_DIGEST: ${{ steps.custody_checker_tool_part1.outputs.artifact-digest }}
          CHECKER_TOOL_2_ID: ${{ steps.custody_checker_tool_part2.outputs.artifact-id }}
          CHECKER_TOOL_2_DIGEST: ${{ steps.custody_checker_tool_part2.outputs.artifact-digest }}
          CONSUMER_TOOL_1_ID: ${{ steps.custody_consumer_tool_part1.outputs.artifact-id }}
          CONSUMER_TOOL_1_DIGEST: ${{ steps.custody_consumer_tool_part1.outputs.artifact-digest }}
          CONSUMER_TOOL_2_ID: ${{ steps.custody_consumer_tool_part2.outputs.artifact-id }}
          CONSUMER_TOOL_2_DIGEST: ${{ steps.custody_consumer_tool_part2.outputs.artifact-digest }}
          ORACLE_TOOL_1_ID: ${{ steps.custody_oracle_tool_part1.outputs.artifact-id }}
          ORACLE_TOOL_1_DIGEST: ${{ steps.custody_oracle_tool_part1.outputs.artifact-digest }}
          ORACLE_TOOL_2_ID: ${{ steps.custody_oracle_tool_part2.outputs.artifact-id }}
          ORACLE_TOOL_2_DIGEST: ${{ steps.custody_oracle_tool_part2.outputs.artifact-digest }}
          TOOL_INPUTS_1_ID: ${{ steps.custody_tool_inputs_part1.outputs.artifact-id }}
          TOOL_INPUTS_1_DIGEST: ${{ steps.custody_tool_inputs_part1.outputs.artifact-digest }}
          TOOL_INPUTS_2_ID: ${{ steps.custody_tool_inputs_part2.outputs.artifact-id }}
          TOOL_INPUTS_2_DIGEST: ${{ steps.custody_tool_inputs_part2.outputs.artifact-digest }}
        run: |
          set -eu
          python - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path('custody-prepared.json').read_text())
          rows = []
          for part in data['parts']:
              key = part['role'].replace('-', '_').upper() + '_' + str(part['part'])
              ident, digest = os.environ[key + '_ID'], os.environ[key + '_DIGEST']
              if not re.fullmatch(r'[1-9][0-9]*', ident) or not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise SystemExit('invalid uploaded artifact identity')
              rows.append({'name': part['name'], 'id': int(ident), 'digest': 'sha256:' + digest})
          Path('custody-uploads.json').write_text(json.dumps(rows))
          PYCODE
          seal=$(python -c 'import json; print(json.load(open("seal-pushed.json"))["digest"].removeprefix("sha256:"))')
          content=$(python -c 'import json; print(json.load(open("content-pushed.json"))["digest"].removeprefix("sha256:"))')
          p11lab custody finalize --environment softhsm2 --channel release --artifact build-out/artifact.json \
            --evidence-dir source-preparation/evidence --validation-dir validation-out --validation-policy "$RUNNER_TEMP/p11lab-tools/validation-policy.json" \
            --build-receipt build-out/artifact.json --sealed-dir seal-out --registry ghcr.io/p11lab/softhsm2 \
            --source-manifest-digest "$seal" --content-manifest-digest "$content" \
            --attestation-context source-context-out/source-context.json --bundle "$P11LAB_ATTESTATION_BUNDLE" \
            --gh "$RUNNER_TEMP/p11lab-gh/gh_2.103.2_linux_amd64/bin/gh" --trusted-root "$RUNNER_TEMP/p11lab-trusted-root.jsonl" \
            --component-sources custody-component-sources.json --payload-dir custody-out \
            --uploads custody-uploads.json --output-dir custody-finalization > custody-finalization-result.json

      - name: Attest the checked custody finalization
        id: custody_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: custody-finalization/custody-finalization.json
          predicate-type: https://p11lab.org/attestations/image-custody/v1
          predicate: '{"schema_version":1}'

      - name: Stage the two-file custody control
        shell: bash
        env:
          P11LAB_CUSTODY_BUNDLE: ${{ steps.custody_attestation.outputs.bundle-path }}
        run: |
          set -eu
          mkdir custody-control
          cp custody-finalization/custody-finalization.json custody-control/custody-finalization.json
          cp "$P11LAB_CUSTODY_BUNDLE" custody-control/bundle.json

      - name: Upload the separately attested custody control
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p11lab-image-custody-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: custody-control/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
