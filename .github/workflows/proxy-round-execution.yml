# SPDX-License-Identifier: Apache-2.0
# Execution path: invokes `p11lab proxy execute-cell` (one cell per job)
# and `p11lab proxy aggregate`, uploading real per-cell observations plus
# the verdict row and capsule. Values stay scaffold-scoped:
# experiment_positive is always false; refusals exit 1/2 after upload.
name: proxy-round-execution
on:
  workflow_call:
    inputs:
      proxy_sha:
        required: true
        type: string
      tier:
        required: true
        type: string
      p11lab_ref:
        required: true
        type: string
    outputs:
      result-artifact:
        value: "${{ jobs.aggregate.outputs['result-artifact'] }}"
      result-sha256:
        value: "${{ jobs.aggregate.outputs['result-sha256'] }}"
      experiment-positive:
        value: "${{ jobs.aggregate.outputs['experiment-positive'] }}"
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate input identities
        id: inputs
        shell: sh
        env:
          PROXY_SHA: ${{ inputs.proxy_sha }}
          TIER: ${{ inputs.tier }}
          P11LAB_REF: ${{ inputs.p11lab_ref }}
        run: |
          case "$PROXY_SHA" in ''|*[!0-9a-f]*) exit 1 ;; esac
          test "${#PROXY_SHA}" -eq 40
          case "$P11LAB_REF" in ''|*[!0-9a-f]*) exit 1 ;; esac
          test "${#P11LAB_REF}" -eq 40
          case "$TIER" in proxy-diagnostic-v1) ;; *) exit 1 ;; esac
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p11lab/p11lab
          ref: ${{ inputs.p11lab_ref }}
          path: p11lab-control
          persist-credentials: false
      - name: Verify control identity
        shell: sh
        env:
          P11LAB_REF: ${{ inputs.p11lab_ref }}
        run: |
          test "$(git -C p11lab-control rev-parse HEAD)" = "$P11LAB_REF"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Validate execution policy
        shell: sh
        env:
          PROXY_SHA: ${{ inputs.proxy_sha }}
          TIER: ${{ inputs.tier }}
          P11LAB_REF: ${{ inputs.p11lab_ref }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/p11lab-control/src" python - <<'PY'
          import os
          from p11lab import proxy_policy
          loaded = proxy_policy.load_proxy_policy(os.environ['TIER'])
          assert loaded.tier_qualified is False, 'diagnostic tier must stay unqualified'
          assert loaded.activation_state == 'diagnostic', 'diagnostic activation only'
          print('policy_digest=' + loaded.policy_digest)
          print('provider=' + loaded.provider['family'] + '/' + loaded.provider['channel'] + '/' + loaded.provider['platform'])
          print('expected_same_run_artifact=' + 'p11lab-proxy-dist-' + os.environ['PROXY_SHA'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          PY
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate input identities
        id: inputs
        shell: sh
        env:
          PROXY_SHA: ${{ inputs.proxy_sha }}
          TIER: ${{ inputs.tier }}
          P11LAB_REF: ${{ inputs.p11lab_ref }}
        run: |
          case "$PROXY_SHA" in ''|*[!0-9a-f]*) exit 1 ;; esac
          test "${#PROXY_SHA}" -eq 40
          case "$P11LAB_REF" in ''|*[!0-9a-f]*) exit 1 ;; esac
          test "${#P11LAB_REF}" -eq 40
          case "$TIER" in proxy-diagnostic-v1) ;; *) exit 1 ;; esac
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p11lab/p11lab
          ref: ${{ inputs.p11lab_ref }}
          path: p11lab-control
          persist-credentials: false
      - name: Verify control identity
        shell: sh
        env:
          P11LAB_REF: ${{ inputs.p11lab_ref }}
        run: |
          test "$(git -C p11lab-control rev-parse HEAD)" = "$P11LAB_REF"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Download producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p11lab-proxy-dist-${{ inputs.proxy_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proxy-producer
      - name: Execute one proxy cell
        id: result
        shell: sh
        env:
          PROXY_SHA: ${{ inputs.proxy_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CELL: direct
        run: |
          CELL_DIR="$RUNNER_TEMP/proxy-cell-$CELL"
          ARTIFACT_DIR="$RUNNER_TEMP/proxy-producer/p11lab-proxy-dist-$PROXY_SHA-$RUN_ATTEMPT"
          code=0
          PYTHONPATH="$GITHUB_WORKSPACE/p11lab-control/src" python -m p11lab proxy execute-cell --cell "$CELL" --artifact "$ARTIFACT_DIR" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --cell-payload "$ARTIFACT_DIR/cell-payload-$CELL.json" --output-dir "$CELL_DIR" --output-json "$CELL_DIR/row.json" >"$RUNNER_TEMP/cell-$CELL.log" 2>&1 || code=$?
          CELL_EXIT="$code" python - <<'PY'
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          cell = os.environ['CELL']
          code = int(os.environ['CELL_EXIT'])
          cause = 'missing-row'
          row_path = temp / ('proxy-cell-' + cell) / 'row.json'
          if row_path.exists():
              row = json.loads(row_path.read_text())
              cause = row.get('typed_cause') or row['cause']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('cell_exit=%d\n' % code)
              handle.write('cell_cause=%s\n' % cause)
          if code != 0:
              print((temp / ('cell-' + cell + '.log')).read_text())
          PY
          if test -d "$CELL_DIR"; then mv "$RUNNER_TEMP/cell-$CELL.log" "$CELL_DIR/cell-$CELL.log"; fi
      - name: Upload cell observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p11lab-proxy-cell-direct-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proxy-cell-direct
          if-no-files-found: error
          retention-days: 14
      - name: Report cell verdict
        shell: sh
        env:
          CELL_EXIT: ${{ steps.result.outputs.cell_exit }}
          CELL_CAUSE: ${{ steps.result.outputs.cell_cause }}
        run: |
          case "$CELL_EXIT" in
            0) exit 0 ;;
            1) echo "refused: $CELL_CAUSE" >&2; exit 1 ;;
            2) echo "refused: $CELL_CAUSE" >&2; exit 2 ;;
            *) echo "unexpected cell exit: $CELL_EXIT ($CELL_CAUSE)" >&2; exit 2 ;;
          esac
