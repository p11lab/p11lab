          code=0
          PYTHONPATH="$GITHUB_WORKSPACE/p11lab-control/src" python -m p11lab proxy execute-cell --cell "$CELL" --artifact "$ARTIFACT_DIR" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --cell-payload "$ARTIFACT_DIR/cell-payload-$CELL.json" --output-dir "$CELL_DIR" --output-json "$CELL_DIR/row.json" >"$RUNNER_TEMP/cell-$CELL.log" 2>&1 || code=$?
          CELL_EXIT="$code" python - <<'PY'
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          cell = os.environ['CELL']
          code = int(os.environ['CELL_EXIT'])
