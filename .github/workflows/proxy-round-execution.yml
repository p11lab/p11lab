          if test -d "$CELL_DIR"; then mv "$RUNNER_TEMP/cell-$CELL.log" "$CELL_DIR/cell-$CELL.log"; fi
      - name: Upload cell observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p11lab-proxy-cell-accepted-proxy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proxy-cell-accepted-proxy
          if-no-files-found: error
          retention-days: 14
      - name: Report cell verdict
        shell: sh
        env:
          CELL_EXIT: ${{ steps.result.outputs.cell_exit }}
          CELL_CAUSE: ${{ steps.result.outputs.cell_cause }}
        run: |
          case "$CELL_EXIT" in
            0) exit 0 ;;
            1) echo "refused: $CELL_CAUSE" >&2; exit 1 ;;
            2) echo "refused: $CELL_CAUSE" >&2; exit 2 ;;
            *) echo "unexpected cell exit: $CELL_EXIT ($CELL_CAUSE)" >&2; exit 2 ;;
          esac
  candidate-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate input identities
        id: inputs
        shell: sh
        env:
          PROXY_SHA: ${{ inputs.proxy_sha }}
          TIER: ${{ inputs.tier }}
          P11LAB_REF: ${{ inputs.p11lab_ref }}
        run: |
          case "$PROXY_SHA" in ''|*[!0-9a-f]*) exit 1 ;; esac
          test "${#PROXY_SHA}" -eq 40
          case "$P11LAB_REF" in ''|*[!0-9a-f]*) exit 1 ;; esac
          test "${#P11LAB_REF}" -eq 40
          case "$TIER" in proxy-diagnostic-v1) ;; *) exit 1 ;; esac
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p11lab/p11lab
          ref: ${{ inputs.p11lab_ref }}
          path: p11lab-control
          persist-credentials: false
      - name: Verify control identity
        shell: sh
        env:
          P11LAB_REF: ${{ inputs.p11lab_ref }}
        run: |
