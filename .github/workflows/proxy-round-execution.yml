          if code != 0:
              print((temp / ('cell-' + cell + '.log')).read_text())
          PY
          if test -d "$CELL_DIR"; then mv "$RUNNER_TEMP/cell-$CELL.log" "$CELL_DIR/cell-$CELL.log"; fi
      - name: Upload cell observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p11lab-proxy-cell-candidate-proxy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proxy-cell-candidate-proxy
          if-no-files-found: error
          retention-days: 14
      - name: Report cell verdict
        shell: sh
        env:
          CELL_EXIT: ${{ steps.result.outputs.cell_exit }}
