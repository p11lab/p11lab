# SPDX-License-Identifier: Apache-2.0
# Rebuild/retest orchestrator for provider images (static contract only).
# Pipeline: select (resolve once: keys, mode, frozen plan, exact artifact
# reference; empty digest means rebuild, never tag resolution) -> build
# (rebuild only, from the locked recipe, receipt recorded) ->
# validate-local (M03 local validation gate before any fanout) ->
# validate-direct + validate-proxy (reusable lane calls with the single
# environment and the exact digest) -> aggregate (always runs; records
# both keys, per-leg evidence, and the M08 promotion verdict).
# Reusable plus manual dispatch only; scheduling authority resolves work,
# so this workflow never self-triggers. Tool and round values flow only
# from the protected policy at the pinned control commit, never from
# inputs; policy loading is inline below (round precedent), no new
# module. Lanes are the operational fanout now; round workflows stay
# diagnostic stubs whose outputs never feed the verdict. The proxy leg is
# included for completeness but pinned non-qualifying until the M07
# operational legs land. Pilots and publication stay behind the
# authorization boundary.
name: provider-image-validation

on:
  workflow_call:
    inputs:
      environment:
        description: 'Single catalogue environment to validate.'
        required: true
        type: string
      channel:
        description: 'Locked channel.'
        required: false
        type: string
        default: 'release'
      digest:
        description: 'Empty means rebuild; otherwise the exact digest to retest.'
        required: false
        type: string
        default: ''
      suite:
        description: 'smoke or full.'
        required: false
        type: string
        default: 'smoke'
      p11lab_ref:
        description: 'Pinned 40-hex control commit for reusable calls.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Single catalogue environment to validate.'
        required: true
        default: 'softhsm2'
      channel:
        description: 'Locked channel.'
        required: true
        default: 'release'
      digest:
        description: 'Empty means rebuild; otherwise the exact digest to retest.'
        required: false
        default: ''
      suite:
        description: 'smoke or full.'
        required: true
        default: 'smoke'
      p11lab_ref:
        description: 'Pinned 40-hex control commit for manual runs.'
        required: true

permissions: {}

concurrency:
  group: provider-image-${{ inputs.environment }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      provider_build_key: ${{ steps.resolve.outputs.provider_build_key }}
      experiment_key: ${{ steps.resolve.outputs.experiment_key }}
      plan_digest: ${{ steps.resolve.outputs.plan_digest }}
      artifact_digest: ${{ steps.resolve.outputs.artifact_digest }}
      artifact_reference: ${{ steps.resolve.outputs.artifact_reference }}
      policy_sha256: ${{ steps.resolve.outputs.policy_sha256 }}
    steps:
      - name: Validate input identities
        shell: sh
        env:
          P11LAB_INPUT_ENVIRONMENT: ${{ inputs.environment }}
          P11LAB_INPUT_CHANNEL: ${{ inputs.channel }}
          P11LAB_INPUT_DIGEST: ${{ inputs.digest }}
          P11LAB_INPUT_SUITE: ${{ inputs.suite }}
          P11LAB_INPUT_REF: ${{ inputs.p11lab_ref }}
        run: |
          set -eu
          case "$P11LAB_INPUT_REF" in ''|*[!0-9a-f]*) echo 'p11lab_ref must be 40-hex' >&2; exit 1 ;; esac
          test "${#P11LAB_INPUT_REF}" -eq 40
          test "$P11LAB_INPUT_ENVIRONMENT" = softhsm2
          test "$P11LAB_INPUT_CHANNEL" = release
          # smoke selects the frozen smoke-v1 set; full stays closed until full-v1 lands.
          case "$P11LAB_INPUT_SUITE" in
            smoke) ;;
            full) echo 'full needs the frozen full-v1 profile' >&2; exit 1 ;;
            *) echo 'suite must be smoke or full' >&2; exit 1 ;;
          esac
          case "$P11LAB_INPUT_DIGEST" in
            '') ;;
            sha256:*)
              suffix=${P11LAB_INPUT_DIGEST#sha256:}
              case "$suffix" in ''|*[!0-9a-f]*) echo 'digest must be empty or an exact sha256 digest' >&2; exit 1 ;; esac
              test "${#suffix}" -eq 64 || { echo 'digest must be empty or an exact sha256 digest' >&2; exit 1; }
              ;;
            *@sha256:*)
              suffix=${P11LAB_INPUT_DIGEST##*@sha256:}
              case "$suffix" in ''|*[!0-9a-f]*) echo 'digest must be empty or an exact sha256 digest' >&2; exit 1 ;; esac
              test "${#suffix}" -eq 64 || { echo 'digest must be empty or an exact sha256 digest' >&2; exit 1; }
              ;;
            *) echo 'digest must be empty or an exact sha256 digest' >&2; exit 1 ;;
          esac
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p11lab/p11lab
          ref: ${{ inputs.p11lab_ref }}
          path: p11lab-control
          persist-credentials: false
      - name: Verify control identity
        shell: sh
        env:
          P11LAB_INPUT_REF: ${{ inputs.p11lab_ref }}
        run: |
          set -eu
          test "$(git -C p11lab-control rev-parse HEAD)" = "$P11LAB_INPUT_REF"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Resolve work once before fanout
        id: resolve
        shell: sh
        env:
          P11LAB_INPUT_ENVIRONMENT: ${{ inputs.environment }}
          P11LAB_INPUT_CHANNEL: ${{ inputs.channel }}
          P11LAB_INPUT_DIGEST: ${{ inputs.digest }}
          P11LAB_INPUT_SUITE: ${{ inputs.suite }}
          P11LAB_INPUT_REF: ${{ inputs.p11lab_ref }}
        run: |
          set -eu
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          # Resolve once before fanout: keys, mode, and the frozen plan digest.
          # Empty digest means rebuild from the locked recipe; never tag resolution.
          # Only an exact sha256 digest selects retest work; a mutable alias never does.
          # Rebuild on provider inputs; retest keeps the exact provider ref with a new experiment key.
          # A docs-only change schedules no provider build.
          # A missing/failed prior result never satisfies completed-key lookup.
          # Provider identity comes from the locked recipe via the runtime
          # identity interface; tool-only changes must not move it. No key,
          # digest, or receipt below is derived from the policy hash: rebuild
          # artifacts that do not exist yet stay explicitly pending, and any
          # claim the accepted records cannot back fails before emission.
          control = os.path.join(os.environ['GITHUB_WORKSPACE'], 'p11lab-control')
          policy = json.loads(open(os.path.join(control, 'src/p11lab/data/ci/validation-policy.json'), encoding='utf-8').read())
          assert set(policy) == {'schema_version', 'kind', 'source_revisions', 'fixed_tools', 'evaluator', 'control', 'providers', 'rounds'}
          assert policy['schema_version'] == 1 and policy['kind'] == 'provider-image-validation'
          for rev in (policy['source_revisions']['checker'], policy['source_revisions']['proxy'],
                      policy['rounds']['framework_sha'], policy['rounds']['proxy_sha']):
              assert re.fullmatch(r'[0-9a-f]{40}', rev) is not None
          assert re.fullmatch(r'[0-9a-f]{64}', policy['control']['profile_sha256']) is not None
          assert policy['providers'] == {'allowlist': ['softhsm2'], 'mode': 'explicit-allowlist'}
          assert os.environ['P11LAB_INPUT_ENVIRONMENT'] in policy['providers']['allowlist']
          # Guard dominates every claim below: while any unqualified marker
          # remains, fail here before deriving or emitting anything.
          markers = [value for value in json.dumps(policy).split('"') if value.startswith('unqualified:')]
          if markers:
              raise SystemExit('gate unsatisfiable: %d unqualified marker(s) in protected policy' % len(markers))
          sys.path.insert(0, os.path.join(control, 'src'))
          from p11lab.build import runtime_inputs
          from p11lab.catalog import load_environment, validate_build_inputs
          from p11lab.identity import artifact_key
          from p11lab import image_ci
          spec = load_environment(os.environ['P11LAB_INPUT_ENVIRONMENT'], os.environ['P11LAB_INPUT_CHANNEL'])
          validate_build_inputs(spec)
          provider_build_key = artifact_key('runtime', runtime_inputs(spec))
          policy_sha256 = hashlib.sha256(json.dumps(policy, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          digest = os.environ['P11LAB_INPUT_DIGEST']
          if digest == '':
              mode = 'rebuild'
              artifact_digest = 'pending:rebuild'
              artifact_reference = 'pending:rebuild:' + provider_build_key
          else:
              assert re.fullmatch(r'(?:[a-z0-9][a-z0-9._:/-]*@)?sha256:[0-9a-f]{64}', digest) is not None, 'digest must match @sha256:[0-9a-f]{64}'
              mode = 'retest'
              artifact_digest = digest.rsplit('@', 1)[-1] if '@' in digest else digest
              artifact_reference = digest if '@' in digest else 'local/provider-image@' + digest
          # Experiment bindings come only from accepted records. The
          # qualification slice extends the protected policy with
          # experiment_bindings (provider provenance, content, roster,
          # input-path snapshots); until then refuse to substitute.
          bindings = policy.get('experiment_bindings')
          if not isinstance(bindings, dict):
              raise SystemExit('no accepted experiment_bindings for %s; refusing to substitute' % mode)
          try:
              provider = None
              if mode == 'retest':
                  sha = artifact_digest.removeprefix('sha256:')
                  provider = {'artifact': {'kind': 'oci', 'reference': artifact_reference,
                                            'sha256': sha, 'platform': spec['runtime_platforms'][0]},
                              'build_key': bindings['provider']['build_key'],
                              'provenance_sha256': bindings['provider']['provenance_sha256']}
              experiment = {'provider': provider,
                            'policy_sha256': policy_sha256,
                            'tools': policy['fixed_tools'],
                            'content': bindings['content'],
                            'roster': bindings['roster'],
                            'input_paths': bindings['input_paths']}
              if mode == 'retest':
                  experiment_key = image_ci.experiment_key(experiment)
              else:
                  experiment_key = 'pending:rebuild'
              frozen = image_ci._freeze_experiment(experiment, provider_build_key, spec['runtime_platforms'][0], mode == 'rebuild')
              plan_digest = frozen['sha256']
          except (KeyError, TypeError, image_ci.ImageCIError) as error:
              raise SystemExit('unusable experiment bindings; refusing to substitute: %s' % error)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('mode=%s\nprovider_build_key=%s\nexperiment_key=%s\nplan_digest=%s\nartifact_digest=%s\nartifact_reference=%s\npolicy_sha256=%s\n'
                           % (mode, provider_build_key, experiment_key, plan_digest, artifact_digest, artifact_reference, policy_sha256))
          PY
  build:
    needs:
      - select
    if: ${{ needs.select.outputs.mode == 'rebuild' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p11lab/p11lab
          ref: ${{ inputs.p11lab_ref }}
          path: p11lab-control
          persist-credentials: false
      - name: Verify control identity
        shell: sh
        env:
          P11LAB_INPUT_REF: ${{ inputs.p11lab_ref }}
        run: |
          set -eu
          test "$(git -C p11lab-control rev-parse HEAD)" = "$P11LAB_INPUT_REF"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Build exact image and record receipt
        shell: sh
        env:
          P11LAB_SELECT_BUILD_KEY: ${{ needs.select.outputs.provider_build_key }}
          P11LAB_ARTIFACT_REF: ${{ needs.select.outputs.artifact_reference }}
          P11LAB_INPUT_ENVIRONMENT: ${{ inputs.environment }}
          P11LAB_INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          # Re-verify the declared provider build key against the locked
          # recipe via the runtime identity interface, then record the
          # build receipt with the reverification outcome. No verified
          # claim is emitted unless this reverification executes first;
          # while any unqualified marker remains, fail before emitting.
          control = os.path.join(os.environ['GITHUB_WORKSPACE'], 'p11lab-control')
          policy = json.loads(open(os.path.join(control, 'src/p11lab/data/ci/validation-policy.json'), encoding='utf-8').read())
          assert policy['schema_version'] == 1 and policy['kind'] == 'provider-image-validation'
          markers = [value for value in json.dumps(policy).split('"') if value.startswith('unqualified:')]
          if markers:
              raise SystemExit('gate unsatisfiable: %d unqualified marker(s) in protected policy' % len(markers))
          sys.path.insert(0, os.path.join(control, 'src'))
          from p11lab.build import runtime_inputs
          from p11lab.catalog import load_environment, validate_build_inputs
          from p11lab.identity import artifact_key
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['P11LAB_SELECT_BUILD_KEY']) is not None
          spec = load_environment(os.environ['P11LAB_INPUT_ENVIRONMENT'], os.environ['P11LAB_INPUT_CHANNEL'])
          validate_build_inputs(spec)
          rederived = artifact_key('runtime', runtime_inputs(spec))
          assert rederived == os.environ['P11LAB_SELECT_BUILD_KEY'], 'declared provider build key does not match locked recipe'
          receipt = {'schema_version': 1, 'kind': 'provider-build-receipt',
                     'provider_build_key': os.environ['P11LAB_SELECT_BUILD_KEY'],
                     'reverified_build_key': rederived,
                     'artifact_reference': os.environ['P11LAB_ARTIFACT_REF'],
                     'inputs_reverified': rederived == os.environ['P11LAB_SELECT_BUILD_KEY']}
          receipt_path = os.path.join(os.environ['RUNNER_TEMP'], 'build-receipt.json')
          with open(receipt_path, 'w', encoding='utf-8') as handle:
              handle.write(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(hashlib.sha256(open(receipt_path, 'rb').read()).hexdigest())
          PY
      - name: Upload build receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-build-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-receipt.json
          if-no-files-found: error
          retention-days: 14
  validate-local:
    needs:
      - select
      - build
    if: ${{ always() && (needs.select.outputs.mode == 'retest' || needs.build.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      validation_status: ${{ steps.gate.outputs.validation_status }}
      infrastructure_errors: ${{ steps.gate.outputs.infrastructure_errors }}
      artifact_digest: ${{ steps.gate.outputs.artifact_digest }}
    steps:
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p11lab/p11lab
          ref: ${{ inputs.p11lab_ref }}
          path: p11lab-control
          persist-credentials: false
      - name: Verify control identity
        shell: sh
        env:
          P11LAB_INPUT_REF: ${{ inputs.p11lab_ref }}
        run: |
          set -eu
          test "$(git -C p11lab-control rev-parse HEAD)" = "$P11LAB_INPUT_REF"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Run M03 local validation before fanout
        id: gate
        shell: sh
        env:
          P11LAB_ARTIFACT_REF: ${{ needs.select.outputs.artifact_reference }}
          P11LAB_SELECT_DIGEST: ${{ needs.select.outputs.artifact_digest }}
        run: |
          set -eu
          python - <<'PY'
          import json
          import os
          import re
          import sys
          # Pre-fanout gate over the M03 facade with the caller policy derived
          # from the protected data at this pinned control checkout. The M08
          # policy is gate-unsatisfiable while it holds unqualified markers,
          # so the call below fails closed until accepted manifests land.
          control = os.path.join(os.environ['GITHUB_WORKSPACE'], 'p11lab-control')
          policy = json.loads(open(os.path.join(control, 'src/p11lab/data/ci/validation-policy.json'), encoding='utf-8').read())
          markers = [value for value in json.dumps(policy).split('"') if value.startswith('unqualified:')]
          if markers:
              raise SystemExit('gate unsatisfiable: %d unqualified marker(s) in protected policy' % len(markers))
          sys.path.insert(0, os.path.join(control, 'src'))
          from p11lab import image_validation
          result = image_validation.validate_image(
              {'artifact': os.environ['P11LAB_ARTIFACT_REF']},
              {'tools': policy['fixed_tools'], 'evaluator': policy['evaluator'],
               'control_base_revision': policy['control']['control_commit']},
              os.path.join(os.environ['RUNNER_TEMP'], 'validate-local'))
          assert result['status'] == 'observations-complete', result['status']
          assert result['infrastructure_errors'] == [], result['infrastructure_errors']
          assert re.fullmatch(r'[0-9a-f]{64}', result['fixed_policy_sha256']) is not None
          # No leg runs before this gate holds: status green with zero
          # infrastructure_errors before any fanout. The gate re-emits the exact
          # digest it validated so the fanout consumes no parallel reference.
          digest = os.environ['P11LAB_SELECT_DIGEST']
          assert not digest.startswith('pending:'), 'pending artifact refused before fanout'
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is not None
          assert digest in os.environ['P11LAB_ARTIFACT_REF']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('validation_status=%s\ninfrastructure_errors=%d\nartifact_digest=%s\n'
                           % (result['status'], len(result['infrastructure_errors']), digest))
          PY
  validate-direct:
    needs:
      - validate-local
    uses: ./.github/workflows/checker-direct-validation.yml
    permissions:
      contents: read
      actions: read
    with:
      environment: ${{ inputs.environment }}
      digest: ${{ needs.validate-local.outputs.artifact_digest }}
      suite: ${{ inputs.suite }}
  validate-proxy:
    needs:
      - validate-local
    uses: ./.github/workflows/checker-proxy-validation.yml
    permissions:
      contents: read
      actions: read
    with:
      environment: ${{ inputs.environment }}
      digest: ${{ needs.validate-local.outputs.artifact_digest }}
      suite: ${{ inputs.suite }}
  aggregate:
    needs:
      - select
      - build
      - validate-local
      - validate-direct
      - validate-proxy
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p11lab/p11lab
          ref: ${{ inputs.p11lab_ref }}
          path: p11lab-control
          persist-credentials: false
      - name: Verify control identity
        shell: sh
        env:
          P11LAB_INPUT_REF: ${{ inputs.p11lab_ref }}
        run: |
          set -eu
          test "$(git -C p11lab-control rev-parse HEAD)" = "$P11LAB_INPUT_REF"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Record result capsule and promotion verdict
        shell: sh
        env:
          P11LAB_MODE: ${{ needs.select.outputs.mode }}
          P11LAB_BUILD_KEY: ${{ needs.select.outputs.provider_build_key }}
          P11LAB_EXP_KEY: ${{ needs.select.outputs.experiment_key }}
          P11LAB_BUILD_RESULT: ${{ needs.build.result }}
          P11LAB_LOCAL_STATUS: ${{ needs.validate-local.outputs.validation_status }}
          P11LAB_LOCAL_ERRORS: ${{ needs.validate-local.outputs.infrastructure_errors }}
          P11LAB_DIRECT_RESULT: ${{ needs.validate-direct.result }}
          P11LAB_PROXY_RESULT: ${{ needs.validate-proxy.result }}
        run: |
          set -eu
          python - <<'PY'
          import json
          import os
          # Record the result capsule: both keys, per-leg evidence-complete, and
          # the M08 promotion verdict. Rounds land later: round outputs must never feed this verdict.
          capsule = {'schema_version': 1, 'kind': 'provider-image-capsule',
                     'mode': os.environ['P11LAB_MODE'],
                     'build_result': os.environ['P11LAB_BUILD_RESULT'],
                     'provider_build_key': os.environ['P11LAB_BUILD_KEY'],
                     'experiment_key': os.environ['P11LAB_EXP_KEY'],
                     'legs': {
                         'validate-direct': {'result': os.environ['P11LAB_DIRECT_RESULT'],
                                             'evidence_complete': os.environ['P11LAB_DIRECT_RESULT'] == 'success'},
                         'validate-proxy': {'result': os.environ['P11LAB_PROXY_RESULT'],
                                            'evidence_complete': os.environ['P11LAB_PROXY_RESULT'] == 'success',
                                            'qualifying': False,
                                            'cause': 'non-qualifying: proxy leg recorded but non-qualifying until M07 operational legs land'}}}
          verdict_inputs = set(capsule['legs'])
          assert 'round_positive' not in verdict_inputs and 'experiment-positive' not in verdict_inputs, 'round outputs refused'
          # Promotion discipline: source-seal and build-content admission precede artifacts.
          # Known unchanged findings are completed observations; a usable image may coexist.
          # Unexpected semantic differences need a reviewed fingerprint and disposition record.
          # There is no diagnostic green and no automatic rebaseline on this path.
          # An unusable image, infrastructure failure, missing evidence, cleanup failure: fail.
          # finalization cannot outrun required legs.
          usable = (os.environ['P11LAB_LOCAL_STATUS'] == 'observations-complete'
                    and os.environ['P11LAB_LOCAL_ERRORS'] == '0'
                    and capsule['legs']['validate-direct']['evidence_complete'])
          capsule['verdict'] = {'usable': usable, 'promotion': 'blocked'}
          capsule_path = os.path.join(os.environ['RUNNER_TEMP'], 'image-capsule.json')
          with open(capsule_path, 'w', encoding='utf-8') as handle:
              handle.write(json.dumps(capsule, sort_keys=True, indent=2) + '\n')
          PY
      - name: Upload result capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-image-capsule-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-capsule.json
          if-no-files-found: error
          retention-days: 14
