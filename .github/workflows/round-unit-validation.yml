# SPDX-License-Identifier: Apache-2.0
name: round-unit-validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install pinned verification dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/round-unit.txt -r .github/requirements/round-workflow.txt
      - name: Verify round workflow contracts
        run: |
          python -m pytest tests/rounds/test_workflow_skeleton.py tests/rounds/test_policy.py -q
          python -m pytest tests/rounds/test_execute_staged.py -q
          python scripts/check_round_workflows.py --contract-fixtures tests/rounds/fixtures/contracts
          python scripts/check_round_workflows.py --root .
