# Temporary trial of the reusable per-provider checker calls (temp branch only).
# Mirrors the provider-delivery validate-* jobs exactly: single environment,
# explicit digest override, advisory findings. Delete before merging.
name: tmp-trial-per-provider-call

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  call-direct:
    uses: ./.github/workflows/checker-direct-validation.yml
    with:
      environment: softhsm2
      digest: 'sha256:69cdeb9a74d13a3382547e184645ee18a7e9e2315246fd40ca814ef97b970d16'
      suite: smoke
      advisory: 'true'

  call-proxy:
    uses: ./.github/workflows/checker-proxy-validation.yml
    with:
      environment: softhsm2
      digest: 'sha256:69cdeb9a74d13a3382547e184645ee18a7e9e2315246fd40ca814ef97b970d16'
      suite: smoke
      advisory: 'true'
